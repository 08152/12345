<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Datei-Browser</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        input, button { padding: 10px; width: 100%; margin-top: 10px; }
        #filelist { margin-top: 20px; }
        li { margin-bottom: 5px; }
    </style>
</head>
<body>

<h2>PIN eingeben</h2>
<input id="pin" type="password" placeholder="PIN eingeben">
<button onclick="checkPin()">Weiter</button>

<div id="content" style="display:none;">
    <h2>Dateien auf deinem PC</h2>
    <div id="filelist"></div>

    <h3>Dateipfad eingeben</h3>
    <input id="path" placeholder="z.B. C:/MailArchive/2026-09-27/bild1.jpg">
    <button onclick="downloadFile()">Download</button>
</div>

<script>
const PIN = "HALLOWELTICHBINSCHLAU123456789";

// Diese URL wird deine EXE später an GitHub pushen:
let API_BASE = ""; 

// Render ruft diese Info vom Server ab
fetch("/api/config")
    .then(r => r.json())
    .then(cfg => API_BASE = cfg.pc_api);

async function checkPin() {
    const entered = document.getElementById("pin").value;
    if (entered !== PIN) {
        alert("Falscher PIN.");
        return;
    }
    document.getElementById("content").style.display = "block";
    await loadFiles();
}

async function loadFiles() {
    const res = await fetch(`${API_BASE}/list_files`);
    const files = await res.json();

    const listDiv = document.getElementById("filelist");
    listDiv.innerHTML = "<ul>" + files.map(f =>
        `<li>${f.path}</li>`
    ).join("") + "</ul>";
}

function downloadFile() {
    const path = document.getElementById("path").value;
    window.location = `${API_BASE}/download_file?path=` + encodeURIComponent(path);
}
</script>

</body>
</html>
